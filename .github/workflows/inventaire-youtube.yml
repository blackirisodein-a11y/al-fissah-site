# Inventaire de la chaîne YouTube de l'école : playlists et vidéos, imprimés dans le journal.
# Onglet Actions → « Inventaire YouTube » → Run workflow. Aucune clé, aucun secret.
name: Inventaire YouTube
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Identifiant d'une vidéo de la chaîne (sert à retrouver la chaîne)"
        default: "MNiWkEPoGNw"
        required: true
permissions:
  contents: write
jobs:
  inventaire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire la chaîne
        run: python3 scripts/inventaire-youtube.py "${{ github.event.inputs.video }}"
      - name: Enregistrer youtube.json dans le dépôt (branche courante)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube.json
          git diff --cached --quiet && echo "youtube.json inchangé" || (git commit -m "Inventaire YouTube : youtube.json mis à jour" && git push)
