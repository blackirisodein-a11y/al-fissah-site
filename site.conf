# Adresse à laquelle le site est publié.
# Elle sert aux balises canoniques, au sitemap et au partage sur les réseaux sociaux.
# Après toute modification ici, relancez :  python3 build.py

site=https://al-fissah.com

# preview=oui  → demande à Google de NE PAS indexer le site (noindex + robots.txt bloquant).
# 21/11/2026 : la vitrine passe de al-fissah.fr à al-fissah.com (l'ancien site disparaît)
# et s'ouvre à Google. al-fissah.fr et www renvoient vers al-fissah.com (.htaccess).
# L'adresse de test al-fissah.blackirys.com, elle, reste TOUJOURS fermée à Google :
# le workflow la construit avec --preview (voir MISE-EN-LIGNE.md).
preview=non

# appli_publiee=oui  → affiche les boutons Google Play et App Store de l'accueil.
# Laisser "non" tant que les fiches des deux boutiques ne sont pas publiques
# (sinon les boutons mènent à une page introuvable). Le bouton Microsoft Store,
# déjà publié, reste toujours affiché.
appli_publiee=non

# app=  → adresse de la plateforme des comptes (inscription, essai gratuit,
# espace élève), SANS barre finale, ex. app=https://app.al-fissah.com
# Tant que cette ligne est vide, le site ne change pas : les boutons
# « Se connecter » gardent leur adresse actuelle et les pages essai.html /
# inscription.html gardent leur formulaire. Une fois renseignée, ces deux
# pages renvoient vers la plateforme et « Se connecter » y mène aussi.
app=https://etudiant.al-fissah.com

# 16/11/2026 : trois accès sur le site — étudiants (app= ci-dessus), enseignants et gestion.
# Adresses SANS barre finale. Vides = l'accès n'est pas affiché.
# Le jour de la bascule : app=https://etudiant.al-fissah.com
app_enseignant=https://enseignant.al-fissah.com
app_gestion=https://gestion.al-fissah.com
