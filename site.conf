# Adresse à laquelle le site est publié.
# Elle sert aux balises canoniques, au sitemap et au partage sur les réseaux sociaux.
# Après toute modification ici, relancez :  python3 build.py

site=https://al-fissah.blackirys.com

# preview=oui  → demande à Google de NE PAS indexer le site.
# À laisser sur "oui" tant que le site est sur cette adresse de test.
# Le jour de la bascule vers al-fissah.com : mettre l'adresse ci-dessus
# et passer preview=non.
preview=oui

# app=  → adresse de la plateforme des comptes (inscription, essai gratuit,
# espace élève), SANS barre finale, ex. app=https://app.al-fissah.com
# Tant que cette ligne est vide, le site ne change pas : les boutons
# « Se connecter » gardent leur adresse actuelle et les pages essai.html /
# inscription.html gardent leur formulaire. Une fois renseignée, ces deux
# pages renvoient vers la plateforme et « Se connecter » y mène aussi.
app=https://al-fissah-app-nine.vercel.app
